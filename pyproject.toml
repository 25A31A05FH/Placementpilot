[project]
name = "placementpilot"
version = "1.0.0"
description = "Smart College Placement Management System"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "PyMySQL>=1.1,<2.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "gunicorn>=23.0,<24.0",
  "whitenoise>=6.8,<7.0",
]

[tool.uv]
package = false

[tool.vercel.scripts]
build = "python vercel_build.py"
